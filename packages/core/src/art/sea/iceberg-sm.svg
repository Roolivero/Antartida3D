<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Nautical ink & watercolor illustration: Small Antarctic Tabular Iceberg with calved bench & notch -->
  <g filter="url(#wcs)">
    <!-- Darker submerged ice skirt below the waterline (--deep + --glacier) -->
    <path d="M26,166 L54,174 L86,176 L112,170 L138,178 L174,177 L194,172 L216,174 L232,166 L226,181 L204,188 L170,191 L134,192 L108,185 L80,190 L46,186 L24,176 Z" fill="#1E3E5C"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Nautical ink & watercolor illustration: Leopard seal hauled out on sea ice floe -->
  <g filter="url(#wcs)">
    <ellipse cx="128" cy="192" rx="104" ry="18" fill="#7FA8C4" opacity="0.48"/>
    <!-- Floating sea-ice floe -->
    <path d="M20,166 L36,188 L108,194 L192,192 L236,180 L240,162 L196,148 L56,148 Z" fill="#7FA8C4"/>
    <path d="M20,166 L54,146 L140,142 L208,148 L240,162 L188,176 L92,178 Z" fill="#F7FAFB"/>
  </g>
  <g filter="url(#ink)">
    <!-- Ice floe ink outline -->
    <path d="M20,166 L54,146 L140,142 L208,148 L240,162 L236,180 L192,192 L108,194 L36,188 Z" fill="none" stroke="#1F2A36" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M20,166 L92,178 L188,176 L240,162 M92,178 L108,194 M188,176 L192,192" fill="none" stroke="#1F2A36" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Shadow on ice under leopard seal -->
    <path d="M46,162 C82,156 142,156 202,164 C168,172 98,172 46,162 Z" fill="#7FA8C4" opacity="0.65"/>

    <!-- Sinuous Leopard Seal silhouette: elongated snout on left, arched torso, hind flippers on right -->
    <path d="M36,114 C36,104 50,96 68,96 C84,96 96,104 108,114 C128,124 152,122 174,128 C192,132 206,138 222,132 C228,130 230,138 220,144 C228,146 230,154 218,158 C198,162 178,162 156,162 C130,162 104,164 82,160 C66,157 56,146 52,132 C42,130 36,122 36,114 Z" fill="#1F2A36" stroke="#1F2A36" stroke-width="3.6" stroke-linejoin="round"/>
    <!-- Pale silver-ivory ventral coat with leopard spots -->
    <path d="M44,122 C58,122 72,120 84,126 C100,134 118,138 142,140 C166,142 186,146 204,154 C178,160 144,161 112,160 C86,159 66,152 56,138 C52,131 48,126 44,122 Z" fill="#F3EBDD"/>
    <!-- Foreflipper resting forward on ice -->
    <path d="M88,144 C82,158 86,168 98,168 C108,168 114,158 108,144" fill="#1F2A36" stroke="#1F2A36" stroke-width="3" stroke-linejoin="round"/>
    <!-- Dark jaw cleft & leopard spots -->
    <path d="M38,116 L64,117" fill="none" stroke="#1F2A36" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="58" cy="106" r="2.2" fill="#F7FAFB"/>
    <circle cx="78" cy="136" r="2.4" fill="#1F2A36"/>
    <circle cx="90" cy="140" r="2.2" fill="#1F2A36"/>
    <circle cx="116" cy="146" r="2.6" fill="#1F2A36"/>
    <circle cx="128" cy="150" r="2.2" fill="#1F2A36"/>
    <circle cx="142" cy="147" r="2.5" fill="#1F2A36"/>
    <circle cx="156" cy="152" r="2.2" fill="#1F2A36"/>
    <circle cx="170" cy="150" r="2.4" fill="#1F2A36"/>
    <!-- Dorsal glacier highlight -->
    <path d="M56,100 C74,99 90,108 106,118 C126,126 150,126 174,132" fill="none" stroke="#7FA8C4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Waterline foam & ripples -->
    <path d="M16,188 C62,198 114,200 166,197 C202,195 228,190 244,182" fill="none" stroke="#F7FAFB" stroke-width="4" stroke-linecap="round"/>
    <path d="M32,200 C80,208 134,208 186,204" fill="none" stroke="#1F2A36" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="12 8"/>
  </g>
</svg>

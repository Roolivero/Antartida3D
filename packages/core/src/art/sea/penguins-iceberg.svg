<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Nautical ink & watercolor illustration: Group of penguins on a small floating ice floe -->
  <!-- Waterline reflection & ice floe base wash -->
  <g filter="url(#wcs)">
    <ellipse cx="128" cy="196" rx="100" ry="20" fill="#7FA8C4" opacity="0.5"/>
    <!-- Shaded side of floating ice floe -->
    <path d="M26,168 L44,192 L106,198 L178,196 L228,186 L234,166 L190,152 L68,152 Z" fill="#7FA8C4"/>
    <!-- Sunlit snow-white top platform of ice floe -->
    <path d="M26,168 L58,146 L132,140 L204,146 L234,166 L182,178 L98,180 Z" fill="#F7FAFB"/>
    <path d="M48,164 L82,148 L152,145 L208,156 L172,172 L96,173 Z" fill="#F3EBDD" opacity="0.65"/>
  </g>
  <g filter="url(#ink)">
    <!-- Ice floe crisp ink outline & facet cracks -->
    <path d="M26,168 L58,146 L132,140 L204,146 L234,166 L228,186 L178,196 L106,198 L44,192 Z" fill="none" stroke="#1F2A36" stroke-width="3.6" stroke-linejoin="round"/>
    <path d="M26,168 L98,180 L182,178 L234,166 M98,180 L106,198 M182,178 L178,196 M64,174 L68,193 M142,179 L142,197" fill="none" stroke="#1F2A36" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Blue shadows cast by penguins on the snow -->
    <ellipse cx="78" cy="162" rx="14" ry="5" fill="#7FA8C4" opacity="0.65"/>
    <ellipse cx="126" cy="158" rx="16" ry="5.5" fill="#7FA8C4" opacity="0.65"/>
    <ellipse cx="174" cy="162" rx="14" ry="5" fill="#7FA8C4" opacity="0.65"/>

    <!-- Penguin 1 (left, looking right) -->
    <path d="M64,160 C62,134 66,104 74,90 C78,82 88,82 92,90 C96,94 102,94 100,98 C94,100 92,104 94,118 C96,134 94,150 90,160 Z" fill="#1F2A36" stroke="#1F2A36" stroke-width="3" stroke-linejoin="round"/>
    <path d="M76,102 C84,102 90,114 90,132 C90,146 86,156 80,158 C74,156 72,144 72,130 C72,114 74,102 76,102 Z" fill="#F7FAFB"/>
    <circle cx="82" cy="98" r="4.5" fill="#C0862F"/>
    <path d="M70,114 C64,126 64,138 68,144" fill="none" stroke="#1F2A36" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Penguin 2 (center-left, tall emperor penguin looking slightly up-right) -->
    <path d="M110,156 C108,124 112,88 122,72 C126,64 138,64 142,74 C148,76 156,76 154,81 C146,83 142,86 144,104 C146,124 144,144 138,156 Z" fill="#1F2A36" stroke="#1F2A36" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M124,86 C134,86 140,102 140,124 C140,140 136,152 128,154 C120,152 118,138 118,120 C118,100 120,86 124,86 Z" fill="#F7FAFB"/>
    <circle cx="131" cy="82" r="5.5" fill="#C0862F"/>
    <path d="M116,100 C108,116 108,132 114,140" fill="none" stroke="#1F2A36" stroke-width="4" stroke-linecap="round"/>

    <!-- Penguin 3 (right, looking left toward center) -->
    <path d="M188,160 C190,134 186,106 178,92 C174,84 164,84 160,92 C154,95 148,95 150,99 C156,101 158,105 156,118 C154,134 156,150 162,160 Z" fill="#1F2A36" stroke="#1F2A36" stroke-width="3" stroke-linejoin="round"/>
    <path d="M174,104 C166,104 160,116 160,132 C160,146 164,156 170,158 C176,156 178,144 178,130 C178,114 176,104 174,104 Z" fill="#F7FAFB"/>
    <circle cx="168" cy="100" r="4.5" fill="#C0862F"/>
    <path d="M180,114 C186,126 186,138 182,144" fill="none" stroke="#1F2A36" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Waterline foam collar -->
    <path d="M18,192 C58,202 104,204 152,202 C192,200 222,194 240,186" fill="none" stroke="#F7FAFB" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M30,204 C76,212 128,213 180,208 C206,205 224,201 236,196" fill="none" stroke="#1F2A36" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="12 8"/>
  </g>
</svg>

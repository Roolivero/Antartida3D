    <path d="M52,194 C68,170 98,160 128,160 C158,160 188,170 204,194 Z" fill="#1F2A36" stroke="#1F2A36" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70,184 C90,168 110,165 128,165 C146,165 166,168 186,184" fill="none" stroke="#7FA8C4" stroke-width="3.6" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Nautical ink & watercolor illustration: Humpback whale bushy vapor spout & blowhole -->
  <!-- Bushy V-shaped watercolor mist plumes -->
  <g filter="url(#bleed)">
    <ellipse cx="102" cy="64" rx="28" ry="24" fill="#F7FAFB" opacity="0.88"/>
    <ellipse cx="154" cy="64" rx="28" ry="24" fill="#F7FAFB" opacity="0.88"/>
    <ellipse cx="128" cy="52" rx="26" ry="22" fill="#F7FAFB" opacity="0.92"/>
    <path d="M120,178 C112,140 92,104 78,72 C98,54 118,52 128,62 C138,52 158,54 178,72 C164,104 144,140 136,178 Z" fill="#F7FAFB" opacity="0.88"/>
  </g>
  <g filter="url(#wcs)">

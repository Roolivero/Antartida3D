    <path d="M134,160 C140,130 158,100 174,72 M142,56 C154,42 174,46 182,62" fill="none" stroke="#1F2A36" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="8 6"/>
    <path d="M128,158 L128,46 M120,148 C114,116 102,88 92,62 M136,148 C142,116 154,88 164,62" fill="none" stroke="#7FA8C4" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="10 5"/>
    <!-- Spray droplets around crown -->
    <circle cx="62" cy="58" r="3.5" fill="#F7FAFB" stroke="#1F2A36" stroke-width="1.8"/>
    <circle cx="54" cy="78" r="2.8" fill="#F7FAFB" stroke="#1F2A36" stroke-width="1.6"/>
    <circle cx="194" cy="58" r="3.5" fill="#F7FAFB" stroke="#1F2A36" stroke-width="1.8"/>
    <circle cx="202" cy="78" r="2.8" fill="#F7FAFB" stroke="#1F2A36" stroke-width="1.6"/>
    <circle cx="128" cy="26" r="3.2" fill="#F7FAFB" stroke="#1F2A36" stroke-width="1.8"/>
    <circle cx="104" cy="30" r="2.6" fill="#F7FAFB" stroke="#1F2A36" stroke-width="1.6"/>
    <circle cx="152" cy="30" r="2.6" fill="#F7FAFB" stroke="#1F2A36" stroke-width="1.6"/>
    <!-- Waterline foam & ripple -->
    <path d="M38,194 C72,184 102,182 128,182 C154,182 184,184 218,194" fill="none" stroke="#1F2A36" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M46,202 C82,195 110,194 128,194 C146,194 174,195 210,202" fill="none" stroke="#F7FAFB" stroke-width="3.8" stroke-linecap="round"/>
